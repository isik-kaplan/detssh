[project]
name = "detssh"
version = "0.6.0"
description = "Deterministic Ed25519 SSH key generation from a seed passphrase, via configurable KDF and salt-hash backends."
readme = "README.md"
authors = [
  { name = "Işık Kaplan", email = "isik.kaplan@outlook.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ssh", "ed25519", "argon2", "scrypt", "pbkdf2", "bcrypt", "kdf", "cryptography"]
classifiers = [
  "Topic :: Security :: Cryptography",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "argon2-cffi>=21.3",
    "cryptography>=41.0",
    "click>=8.1",
    "questionary>=2.1.1",
    "bcrypt>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/isik-kaplan/detssh"
Repository = "https://github.com/isik-kaplan/detssh"

[project.scripts]
detssh = "detssh.cli:run"

[tool.uv]
dev-dependencies = [
    "hypothesis>=6.156.9",
    "mutmut>=3.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detssh"]

[tool.ruff]
line-length = 120
fix = true
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["detssh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=detssh --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["detssh"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.mutmut]
source_paths = ["detssh"]
# --no-cov: mutmut only reruns the subset of tests covering a mutated line, so the
# --cov-fail-under=100 gate in addopts would fail every mutant run for the wrong
# reason. -q keeps per-mutant output down to a dot per test.
pytest_add_cli_args = ["--no-cov", "-q"]
